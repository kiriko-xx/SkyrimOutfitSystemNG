[General]
; Adds the "Change Outfit" lesser power to the player. Turning this off also
; removes the power that was already granted.
QuickslotsEnabled = on

[Customization]
; Default policy used when a new outfit is created. XXOO = "always use the
; outfit", see docs/PAPYRUS_API.md for the policy code table.
NewOutfitDefaultBasePolicy = XXOO

; Give new outfits an explicit per-slot override for the shield slot
; ("passthrough", code XEXO) instead of inheriting the base policy.
NewOutfitSetDefaultSlotPolicies = on

[Debug]
; Verbose logging (per-frame hook tracing, per-mod diagnostics). Leave off
; unless you report a bug.
ExtraLogging = off

; Set this to off to prove whether a crash comes from a hook. The plugin then
; loads without patching anything.
InstallHooks = on

[RandomOutfit]
; Keyboard combo that applies a random outfit to the player.
; Format: modifier+modifier+key, e.g. ctrl+shift+O, alt+F5, ctrl+shift+F9.
Hotkey = ctrl+shift+O
; Keyboard combo that opens the quick outfit picker window (search + page
; navigation). The "Change Outfit" lesser power uses the same window.
QuickPickerHotkey = ctrl+shift+L
; A single key, no modifiers, that opens the same window on the key press.
; The "Change Outfit" lesser power only reaches the window once its cast
; animation has finished, which is what feels like a cooldown on the key; this
; key skips that wait and is limited to one open every 0.5 s. It answers only
; while the "Change Outfit" power is the one selected in the magic menu: the
; default names the key the game binds to Shout, so answering it otherwise
; would take that key away from every other power. The power keeps working
; (its own open does nothing while the window is already open). Leave it empty
; to disable, and note that it is ignored while QuickSlotRandom = on, because
; the power rolls the outfit itself in that mode.
QuickPickerKey = Z
; Only pick outfits marked as favourites.
FavoritesOnly = on
; Never pick the outfit that is already worn.
ExcludeCurrent = on
; What the "Change Outfit" lesser power does: off = open the quick picker
; window (default), on = roll a random outfit instead.
QuickSlotRandom = off

[Compatibility]
; Per-mod integrations with mods that ask the game what the player is wearing.
; The former generic "perception" hooks were removed: mods use their own code.
;
; Advanced Nudity Detection: the plugin writes its nudity factions
; (AND_NudeActorFaction / AND_ToplessFaction / AND_BottomlessFaction) so they
; match the displayed outfit - a slot with no item counts as bare skin.
; Nothing inside AND is patched; only its published faction ranks are set.
AdvancedNudityDetection = on
;
; Procedural Armor Damage tears the mesh that is actually drawn, so illusion
; pieces are damaged through the real armour worn in the same slot. A piece
; shown over a slot with no real armour underneath cannot be damaged.
ProceduralArmorDamage = on

; Faster HDT-SMP (FSMP): after an outfit change, reset the physics of the actor
; that changed. Only that actor is touched, not every loaded NPC.
AutoResetSMP = off
;
; SexLab / OStim: when a scene starts, look for an outfit named
; "<current outfit>_sex" and wear it for the scene. A name that already
; ends with _sex is kept unchanged; if no matching outfit exists the
; current outfit stays. The previous outfit is restored when the scene ends.
SceneOutfitSwitching = off
; Milliseconds between the two passes of the .tri refresh cycle (illusion off, then on).
; 0 = both passes in the same frame, so the real armour is never visible (recommended).
; 20-50 only if a same-frame refresh still keeps the old deformation on your setup.
ReillusionGapMs = 0
; Hand the morph change to RaceMenu / OBody directly (one ApplyBodyMorphs) and only
; rebuild the illusion through the engine when their pass leaves the meshes
; untouched. Turning this off forces the slow remove-and-reapply cycle every time.
MorphProviderFirst = 1

; Armour pieces that always win over the outfit item, in the form
; plugin.esp:LOCALFORMID (hex). The Dragon Aspect armour is built in.
GoldenItems = Dragonborn.esm:00021739

[UI]
; Interface language of the settings menu and the quick picker.
; auto        = follow the game language (sLanguage in Skyrim.ini)
; en / zh     = force English / Chinese
; <other>     = suffix of any SkyrimOutfitSystemNG_<other>.txt found in
;               Data\interface\translations (e.g. "german")
; Chinese glyphs come from the menu framework, which only draws them when
; Data\SKSE\Plugins\SKSEMenuFramework.ini has [Fonts] EnableChinese = true and
; the font it names (CN.ttf by default) exists in Data\SKSE\Plugins\Fonts.
; Without that the menu stays English instead of showing empty boxes.
Language = auto

; Layout of the outfit browser and the quick picker. Both windows share these
; values, and the sliders in the settings page write them back here.
OutfitListWidth = 470
OutfitPageSize = 50
QuickPickerPageSize = 20

; Geometry of the quick picker window (pixels). The plugin writes these when
; you move or resize the window, so the next session opens it exactly there.
; Delete the four keys (or set X/Y to -1) to fall back to a centred 640x800.
QuickPickerX = -1
QuickPickerY = -1
QuickPickerWidth = 640
QuickPickerHeight = 800

; Translations live in Data\interface\translations, one file per language:
;   SkyrimOutfitSystemNG_english.txt
;   SkyrimOutfitSystemNG_chinese.txt
; Skyrim-style format, UTF-16LE recommended:  $English source text<TAB>译文
; (UTF-8 and key=value are accepted too.) Press "Reload the language files" in
; the settings page (menu titles need a game restart). Deleting a line simply
; falls back to the built-in dictionary (Chinese) or to the English literal.
; To add a language, copy _english.txt to SkyrimOutfitSystemNG_<name>.txt,
; translate the right side and restart: <name> shows up in the language combo.
